" x2="330" y2="85" stroke="#d69e2e" stroke-width="1.6" marker-end="url(#ak)"/><text x="230" y="105" text-anchor="middle" font-size="11" fill="#d69e2e">① SRV query</text><line x1="330" y1="100" x2="160" y2="165" stroke="#d69e2e" stroke-width="1.6" marker-end="url(#ak)"/><text x="265" y="150" text-anchor="middle" font-size="11" fill="#d69e2e">② DC list</text><line x1="160" y1="175" x2="640" y2="142" stroke="#6b46c1" stroke-width="1.6" marker-end="url(#ak)"/><text x="470" y="150" text-anchor="middle" font-size="11" fill="#6b46c1">③ ping</text><line x1="160" y1="180" x2="640" y2="222" stroke="#6b46c1" stroke-width="1.6" marker-end="url(#ak)"/><text x="715" y="275" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38a169">④ fastest reply → authenticate</text><text x="410" y="310" text-anchor="middle" font-size="11" fill="#4a5568">SRV records are registered automatically when AD is installed; several DCs are used round-robin.</text></svg>