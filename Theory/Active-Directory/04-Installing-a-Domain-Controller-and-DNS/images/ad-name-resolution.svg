<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="820" height="330" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="410.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Name resolution order and query types</text><rect x="20" y="50" width="300" height="260" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="170.0" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Lookup order on a client</text><rect x="45" y="80" width="250" height="38" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/><text x="170.0" y="103.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">1. Local host name</text><line x1="170" y1="118" x2="170" y2="135" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#ab)"/><rect x="45" y="135" width="250" height="38" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/><text x="170.0" y="158.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">2. hosts file</text><line x1="170" y1="173" x2="170" y2="190" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#ab)"/><rect x="45" y="190" width="250" height="38" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/><text x="170.0" y="213.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a20