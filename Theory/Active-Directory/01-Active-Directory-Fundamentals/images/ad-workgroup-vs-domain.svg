<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="800" height="340" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="400.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Workgroup vs Domain</text><rect x="20" y="50" width="370" height="270" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/><text x="205.0" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Workgroup — local authentication</text><rect x="45" y="110" width="90" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="90.0" y="134.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">PC1</text><rect x="45" y="170" width="90" height="44" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="90.0" y="189.0" text-anchor="middle" font-size="10.5" fill="#1a202c">Local accounts</text><text x="90.0" y="205.0" text-anchor="middle" font-size="10.5" fill="#4a5568">(SAM)</text><line x1="90" y1="150" x2="90" y2="170" stroke="#d69e2e" stroke-width="1.5"/><rect x="160" y="110" width="90" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="205.0" y="134.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">PC2</text><rect x="160" y="170" width="90" height="44" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="205.0" y="189.0" text-anchor="middle" font-size="10.5" fill="#1a202c">Local accounts</text><text x="205.0" y="205.0" text-anchor="middle" font-size="10.5" fill="#4a5568">(SAM)</text><line x1="205" y1="150" x2="205" y2="170" stroke="#d69e2e" stroke-width="1.5"/><rect x="275" y="110" width="90" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="320.0" y="134.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">PC3</text><rect x="275" y="170" width="90" height="44" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="320.0" y="189.0" text-anchor="middle" font-size="10.5" fill="#1a202c">Local accounts</text><text x="320.0" y="205.0" text-anchor="middle" font-size="10.5" fill="#4a5568">(SAM)</text><line x1="320" y1="150" x2="320" y2="170" stroke="#d69e2e" stroke-width="1.5"/><text x="205" y="252" text-anchor="middle" font-size="11.5" fill="#4a5568">Each PC keeps its own accounts and passwords.</text><text x="205" y="272" text-anchor="middle" font-size="11.5" fill="#e53e3e">10 PCs → create and change an account 10 times.</text><rect x="410" y="50" width="370" height="270" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="595.0" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Domain — central authentication (SSO)</text><rect x="525" y="80" width="140" height="48" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/><text x="595.0" y="101.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Domain Controller</text><text x="595.0" y="117.0" text-anchor="middle" font-size="10.5" fill="#4a5568">AD DS database</text><rect x="435" y="200" width="90" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="480.0" y="224.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">PC1</text><line x1="480" y1="200" x2="549.0" y2="130" stroke="#38a169" stroke-width="1.6" marker-end="url(#ag)"/><rect x="550" y="200" width="90" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="595.0" y="224.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">PC2</text><line x1="595" y1="200" x2="595.0" y2="130" stroke="#38a169" stroke-width="1.6" marker-end="url(#ag)"/><rect x="665" y="200" width="90" height="40" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="710.0" y="224.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">PC3</text><line x1="710" y1="200" x2="641.0" y2="130" stroke="#38a169" stroke-width="1.6" marker-end="url(#ag)"/><text x="595" y="168" text-anchor="middle" font-size="10.5" fill="#38a169">authenticate</text><text x="595" y="268" text-anchor="middle" font-size="11.5" fill="#4a5568">One account, one sign-in for every PC and server.</text><text x="595" y="288" text-anchor="middle" font-size="11.5" fill="#e53e3e">If the DC goes down, authentication stops.</text></svg>