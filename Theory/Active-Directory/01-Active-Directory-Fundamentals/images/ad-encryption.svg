<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="840" height="360" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="420.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Symmetric, asymmetric and hybrid encryption</text><rect x="20" y="50" width="240" height="290" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="140.0" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Symmetric key</text><rect x="35" y="90" width="85" height="36" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/><text x="77.5" y="112.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Sender</text><rect x="160" y="90" width="85" height="36" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/><text x="202.5" y="112.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Receiver</text><rect x="300" y="50" width="240" height="290" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/><text x="420.0" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Asymmetric key</text><rect x="315" y="90" width="85" height="36" rx="6" fill="#ffffff" stroke="#6b46c1" stroke-width="1.5"/><text x="357.5" y="112.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Sender</text><rect x="440" y="90" width="85" height="36" rx="6" fill="#ffffff" stroke="#6b46c1" stroke-width="1.5"/><text x="482.5" y="112.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Receiver</text><rect x="580" y="50" width="240" height="290" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="700.0" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Hybrid (e.g. HTTPS)</text><rect x="595" y="90" width="85" height="36" rx="6" fill="#ffffff" stroke="#38a169" stroke-width="1.5"/><text x="637.5" y="112.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Sender</text><rect x="720" y="90" width="85" height="36" rx="6" fill="#ffffff" stroke="#38a169" stroke-width="1.5"/><text x="762.5" y="112.14" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Receiver</text><rect x="35" y="150" width="85" height="30" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="77.5" y="168.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">Key A</text><rect x="160" y="150" width="85" height="30" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="202.5" y="168.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">Key A</text><text x="77" y="198" text-anchor="middle" font-size="10.5" fill="#4a5568">encrypt</text><text x="202" y="198" text-anchor="middle" font-size="10.5" fill="#4a5568">decrypt</text><line x1="120" y1="108" x2="160" y2="108" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#ab)"/><text x="140" y="232" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Same key on both sides</text><text x="140" y="256" text-anchor="middle" font-size="11" fill="#38a169">+ simple and fast</text><text x="140" y="276" text-anchor="middle" font-size="11" fill="#e53e3e">− the key itself must be</text><text x="140" y="292" text-anchor="middle" font-size="11" fill="#e53e3e">delivered safely</text><rect x="315" y="150" width="85" height="30" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="357.5" y="168.78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">Public key</text><rect x="440" y="150" width="85" height="30" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/><text x="482.5" y="168.78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">Private key</text><text x="357" y="198" text-anchor="middle" font-size="10.5" fill="#4a5568">encrypt</text><text x="482" y="198" text-anchor="middle" font-size="10.5" fill="#4a5568">decrypt</text><line x1="400" y1="108" x2="440" y2="108" stroke="#6b46c1" stroke-width="1.6" marker-end="url(#ak)"/><text x="420" y="232" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">Two keys (receiver's pair)</text><text x="420" y="256" text-anchor="middle" font-size="11" fill="#4a5568">Public key: shared</text><text x="420" y="276" text-anchor="middle" font-size="11" fill="#4a5568">Private key: never shared</text><text x="420" y="300" text-anchor="middle" font-size="11" fill="#6b46c1">Basis of PKI · digital signature</text><text x="420" y="318" text-anchor="middle" font-size="10.5" fill="#4a5568">(sign: private · verify: public)</text><rect x="595" y="145" width="210" height="32" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="700.0" y="164.78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">① Symmetric key sent asymmetrically</text><rect x="595" y="187" width="210" height="32" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="700.0" y="206.78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a202c">② Bulk data sent with symmetric key</text><line x1="680" y1="108" x2="720" y2="108" stroke="#38a169" stroke-width="1.6" marker-end="url(#ag)"/><text x="700" y="256" text-anchor="middle" font-size="11" fill="#38a169">Security of asymmetric</text><text x="700" y="276" text-anchor="middle" font-size="11" fill="#38a169">+ speed of symmetric</text></svg>