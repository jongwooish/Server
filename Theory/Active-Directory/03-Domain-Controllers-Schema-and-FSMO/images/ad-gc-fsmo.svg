s book)</text><text x="200" y="215" text-anchor="middle" font-size="11" fill="#2b6cb0">Normal LDAP: 389  ·  GC: 3268</text><text x="200" y="240" text-anchor="middle" font-size="11" fill="#38a169">At least one GC per site</text><rect x="400" y="50" width="360" height="230" rx="8" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="580.0" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Forest-wide FSMO roles</text><text x="580" y="92" text-anchor="middle" font-size="11" fill="#4a5568">one DC per forest (single master)</text><rect x="425" y="105" width="310" height="60" rx="6" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/><text x="580.0" y="132.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Schema Master</text><text x="580.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#4a5568">change / extend the schema</text><rect x="425" y="180" width="310" height="60" rx="6" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/><text x="580.0" y="207.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Domain Naming Master</text><text x="580.0" y="223.0" text-anchor="middle" font-size="10.5" fill="#4a5568">add / remove domains</text></svg>