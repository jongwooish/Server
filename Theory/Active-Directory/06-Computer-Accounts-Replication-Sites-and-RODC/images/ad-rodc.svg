<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="800" height="300" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="400.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">RODC at a branch office</text><rect x="20" y="50" width="330" height="230" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="185.0" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Head office (secure)</text><rect x="60" y="90" width="250" height="60" rx="6" fill="#ffffff" stroke="#38a169" stroke-width="1.5"/><text x="185.0" y="117.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Writable DC</text><text x="185.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#4a5568">read + write · all passwords</text><text x="185" y="190" text-anchor="middle" font-size="11" fill="#4a5568">Changes are made here</text><rect x="450" y="50" width="330" height="230" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/><text x="615.0" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Branch (physically insecure)</text><rect x="490" y="90" width="250" height="60" rx="6" fill="#ffffff" stroke="#e53e3e" stroke-width="1.5"/><text x="615.0" y="117.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">RODC</text><text x="615.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#4a5568">read-only copy</text><text x="615" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#e53e3e">Passwords not stored by default</text><text x="615" y="200" text-anchor="middle" font-size="11" fill="#4a5568">Cache only chosen users' passwords</text><text x="615" y="220" text-anchor="middle" font-size="11" fill="#38a169">→ faster local logon, still secure</text><text x="615" y="250" text-anchor="middle" font-size="11" fill="#4a5568">If stolen, little is exposed</text><line x1="310" y1="120" x2="490" y2="120" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/><text x="400" y="110" text-anchor="middle" font-size="11" fill="#4a5568">one-way replication</text></svg>