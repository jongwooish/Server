<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="820" height="300" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="410.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">What a GPO is made of</text><rect x="320" y="55" width="180" height="50" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="410.0" y="85.76" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">GPO</text><rect x="60" y="150" width="320" height="80" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="220.0" y="187.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">GPC — Group Policy Container</text><text x="220.0" y="203.0" text-anchor="middle" font-size="10.5" fill="#4a5568">stored in AD · where the policy is linked</text><rect x="440" y="150" width="320" height="80" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="600.0" y="187.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">GPT — Group Policy Template</text><text x="600.0" y="203.0" text-anchor="middle" font-size="10.5" fill="#4a5568">stored in SYSVOL · the actual settings</text><line x1="380" y1="105" x2="220" y2="150" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/><line x1="440" y1="105" x2="600" y2="150" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/><text x="220" y="260" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">Link targets: domain · OU · site</text><text x="220" y="280" text-anchor="middle" font-size="10.5" fill="#4a5568">(not a single user, group or computer)</text><text x="600" y="260" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38a169">Computer config: at startup</text><text x="600" y="280" text-anchor="middle" font-size="10.5" fill="#4a5568">User config: at logon · refresh 90 ± 30 min</text></svg>