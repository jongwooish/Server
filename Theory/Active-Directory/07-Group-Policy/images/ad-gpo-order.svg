<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="840" height="300" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="420.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Group Policy processing order</text><rect x="30" y="70" width="170" height="64" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/><text x="115.0" y="107.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">1. Local</text><line x1="200" y1="102" x2="235" y2="102" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/><rect x="235" y="70" width="170" height="64" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="320.0" y="107.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">2. Site</text><line x1="405" y1="102" x2="440" y2="102" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/><rect x="440" y="70" width="170" height="64" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="525.0" y="107.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">3. Domain</text><line x1="610" y1="102" x2="645" y2="102" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ak)"/><rect x="645" y="70" width="170" height="64" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/><text x="730.0" y="107.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">4. OU</text><text x="420" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Applied in this order — the value applied last wins.</text><rect x="30" y="195" width="380" height="80" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="220.0" y="232.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Enforce</text><text x="220.0" y="248.0" text-anchor="middle" font-size="10.5" fill="#4a5568">a higher GPO is pushed down and cannot be overridden</text><rect x="430" y="195" width="380" height="80" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/><text x="620.0" y="232.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Block Inheritance</text><text x="620.0" y="248.0" text-anchor="middle" font-size="10.5" fill="#4a5568">a child OU refuses GPOs from above</text></svg>