<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="860" height="230" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="430.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">AGDLP</text><rect x="30" y="70" width="170" height="110" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="115" y="110" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6cb0">A</text><text x="115" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Account</text><text x="115" y="162" text-anchor="middle" font-size="11" fill="#4a5568">create users</text><line x1="200" y1="125" x2="240" y2="125" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#ak)"/><rect x="240" y="70" width="170" height="110" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="325" y="110" text-anchor="middle" font-size="26" font-weight="700" fill="#38a169">G</text><text x="325" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Global group</text><text x="325" y="162" text-anchor="middle" font-size="11" fill="#4a5568">group the people</text><line x1="410" y1="125" x2="450" y2="125" stroke="#38a169" stroke-width="1.6" marker-end="url(#ak)"/><rect x="450" y="70" width="170" height="110" rx="8" fill="#fffaf0" stroke="#d69e2e" stro