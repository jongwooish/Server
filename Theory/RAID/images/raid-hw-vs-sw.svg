<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="360.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Hardware RAID vs Software RAID</text><text x="185" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Hardware RAID</text><rect x="75" y="82" width="220" height="50" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/><text x="185.0" y="104.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Operating system</text><text x="185.0" y="120.0" text-anchor="middle" font-size="10.5" fill="#4a5568">Sees only 1 logical disk</text><line x1="185" y1="132" x2="185" y2="160" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="75" y="162" width="220" height="50" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="185.0" y="184.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">RAID controller</text><text x="185.0" y="200.0" text-anchor="middle" font-size="10.5" fill="#4a5568">Own processor + cache</text><line x1="185" y1="212" x2="105" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="75" y="252" width="60" height="34" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="105.0" y="273.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk</text><line x1="185" y1="212" x2="185" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="155" y="252" width="60" height="34" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="185.0" y="273.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk</text><line x1="185" y1="212" x2="265" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="235" y="252" width="60" height="34" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="265.0" y="273.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk</text><text x="535" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Software RAID</text><rect x="425" y="82" width="220" height="50" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="535.0" y="104.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Operating system (RAID)</text><text x="535.0" y="120.0" text-anchor="middle" font-size="10.5" fill="#4a5568">Server CPU does the work</text><line x1="535" y1="132" x2="535" y2="160" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="425" y="162" width="220" height="50" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/><text x="535.0" y="184.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Disk controller (HBA)</text><text x="535.0" y="200.0" text-anchor="middle" font-size="10.5" fill="#4a5568">Only connects disks</text><line x1="535" y1="212" x2="455" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="425" y="252" width="60" height="34" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="455.0" y="273.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk</text><line x1="535" y1="212" x2="535" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="505" y="252" width="60" height="34" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="535.0" y="273.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk</text><line x1="535" y1="212" x2="615" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="585" y="252" width="60" height="34" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="615.0" y="273.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk</text><text x="360" y="330" text-anchor="middle" font-size="12" fill="#4a5568">The highlighted layer does the RAID work (striping, parity calculation)</text></svg>