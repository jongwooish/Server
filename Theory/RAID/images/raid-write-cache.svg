<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="840" height="360" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="420.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">Controller cache: Write-Through vs Write-Back</text><text x="215" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Write-Through</text><rect x="20" y="78" width="80" height="30" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/><text x="60.0" y="97.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Server</text><line x1="60" y1="108" x2="60" y2="300" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5 4"/><rect x="175" y="78" width="80" height="30" rx="6" fill="#2c7a7b" stroke="#2c7a7b" stroke-width="1.5"/><text x="215.0" y="97.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Cache</text><line x1="215" y1="108" x2="215" y2="300" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5 4"/><rect x="330" y="78" width="80" height="30" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/><text x="370.0" y="97.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Disk</text><line x1="370" y1="108" x2="370" y2="300" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5 4"/><line x1="60" y1="140" x2="209" y2="140" stroke="#4a5568" stroke-width="2" marker-end="url(#ak)"/><text x="137.5" y="134" text-anchor="middle" font-size="11" fill="#1a202c">1. Write request</text><line x1="215" y1="180" x2="364" y2="180" stroke="#e53e3e" stroke-width="2" marker-end="url(#ar)"/><text x="292.5" y="174" text-anchor="middle" font-size="11" fill="#1a202c">2. Write to disk</text><line x1="370" y1="220" x2="221" y2="220" stroke="#e53e3e" stroke-width="2" marker-end="url(#ar)"/><text x="292.5" y="214" text-anchor="middle" font-size="11" fill="#1a202c">3. Write done</text><line x1="215" y1="260" x2="66" y2="260" stroke="#e53e3e" stroke-width="2" marker-end="url(#ar)"/><text x="137.5" y="254" text-anchor="middle" font-size="11" fill="#1a202c">4. Complete</text><text x="215" y="326" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e53e3e">Reply after the disk write → safe but slow</text><text x="625" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Write-Back</text><rect x="430" y="78" width="80" height="30" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/><text x="470.0" y="97.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Server</text><line x1="470" y1="108" x2="470" y2="300" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5 4"/><rect x="585" y="78" width="80" height="30" rx="6" fill="#2c7a7b" stroke="#2c7a7b" stroke-width="1.5"/><text x="625.0" y="97.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Cache</text><line x1="625" y1="108" x2="625" y2="300" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5 4"/><rect x="740" y="78" width="80" height="30" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/><text x="780.0" y="97.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Disk</text><line x1="780" y1="108" x2="780" y2="300" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5 4"/><line x1="470" y1="140" x2="619" y2="140" stroke="#4a5568" stroke-width="2" marker-end="url(#ak)"/><text x="547.5" y="134" text-anchor="middle" font-size="11" fill="#1a202c">1. Write request</text><line x1="625" y1="180" x2="476" y2="180" stroke="#38a169" stroke-width="2" marker-end="url(#ag)"/><text x="547.5" y="174" text-anchor="middle" font-size="11" fill="#1a202c">2. Complete right away</text><line x1="625" y1="220" x2="774" y2="220" stroke="#38a169" stroke-width="2" marker-end="url(#ag)"/><text x="702.5" y="214" text-anchor="middle" font-size="11" fill="#1a202c">3. Write later (batched)</text><text x="625" y="326" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38a169">Reply when data is in cache → fast, needs power-loss protection</text></svg>