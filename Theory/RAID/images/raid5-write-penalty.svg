 x="494.0" y="155.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a202c">③ Write new data</text><line x1="400" y1="84" x2="686" y2="130" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="601" y="132" width="170" height="38" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="686.0" y="155.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a202c">④ Write new parity</text><text x="400" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">New parity = old parity XOR old data XOR new data</text><text x="400" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#e53e3e">1 request → 4 disk I/Os (write penalty 4)</text></svg>