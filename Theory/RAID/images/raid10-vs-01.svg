<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="800" height="330" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="400.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">RAID 10 vs RAID 01</text><text x="200" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">RAID 10 (1+0)</text><rect x="130" y="76" width="140" height="32" rx="6" fill="#2c7a7b" stroke="#2c7a7b" stroke-width="1.5"/><text x="200.0" y="96.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">RAID 0 stripe</text><line x1="200" y1="108" x2="110" y2="140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="35" y="142" width="150" height="32" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="110.0" y="162.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Mirror pair 1</text><line x1="110" y1="174" x2="70" y2="206" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="35" y="208" width="70" height="32" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="70.0" y="228.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk 1</text><line x1="110" y1="174" x2="150" y2="206" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="115" y="208" width="70" height="32" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="150.0" y="228.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk 2</text><line x1="200" y1="108" x2="290" y2="140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="215" y="142" width="150" height="32" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="290.0" y="162.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Mirror pair 2</text><line x1="290" y1="174" x2="250" y2="206" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="215" y="208" width="70" height="32" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="250.0" y="228.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk 3</text><line x1="290" y1="174" x2="330" y2="206" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="295" y="208" width="70" height="32" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="330.0" y="228.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk 4</text><text x="200" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#38a169">Survives 1 failure inside each pair</text><text x="600" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">RAID 01 (0+1)</text><rect x="530" y="76" width="140" height="32" rx="6" fill="#2c7a7b" stroke="#2c7a7b" stroke-width="1.5"/><text x="600.0" y="96.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">RAID 1 mirror</text><line x1="600" y1="108" x2="510" y2="140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="435" y="142" width="150" height="32" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="510.0" y="162.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Stripe set A</text><line x1="510" y1="174" x2="470" y2="206" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="435" y="208" width="70" height="32" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="470.0" y="228.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk 1</text><line x1="510" y1="174" x2="550" y2="206" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="515" y="208" width="70" height="32" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="550.0" y="228.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk 2</text><line x1="600" y1="108" x2="690" y2="140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="615" y="142" width="150" height="32" rx="6" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/><text x="690.0" y="162.32" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Stripe set B</text><line x1="690" y1="174" x2="650" y2="206" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="615" y="208" width="70" height="32" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="650.0" y="228.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk 3</text><line x1="690" y1="174" x2="730" y2="206" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ak)"/><rect x="695" y="208" width="70" height="32" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="730.0" y="228.32" text-anchor="middle" font-size="12" fill="#1a202c">Disk 4</text><text x="600" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#e53e3e">1 disk failure stops its whole set</text><text x="400" y="312" text-anchor="middle" font-size="12" fill="#4a5568">Same 50% capacity, different fault tolerance → RAID 10 is used in practice</text></svg>