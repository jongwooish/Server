# /etc/wireguard/wg0.conf  (FW)
# keys are the files generated on FW
#   PrivateKey ← /etc/wireguard/server-privatekey
#   PublicKey  ← /etc/wireguard/client-publickey
[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = <server-privatekey>

[Peer]
# REMOTE
PublicKey = <client-publickey>
AllowedIPs = 10.8.0.2/32
