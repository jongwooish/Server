# /etc/wireguard/wg0.conf  (REMOTE)
#   PrivateKey <- /etc/wireguard/client-privatekey
#   PublicKey  <- /etc/wireguard/server-publickey
# import: nmcli connection import type wireguard file /etc/wireguard/wg0.conf
[Interface]
Address = 10.8.0.2/24
PrivateKey = <client-privatekey>
DNS = 10.10.10.10, jjong.internal

[Peer]
PublicKey = <server-publickey>
Endpoint = 203.0.113.10:51820
AllowedIPs = 10.10.0.0/16, 10.8.0.0/24
PersistentKeepalive = 25
