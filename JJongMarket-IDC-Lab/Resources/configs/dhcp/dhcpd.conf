# /etc/dhcp/dhcpd.conf  (MGMT)
# MGMT zone - CLIENT (same segment, broadcast reaches MGMT directly)
subnet 10.10.30.0 netmask 255.255.255.0 {
        range 10.10.30.100 10.10.30.150;
        option domain-name-servers 10.10.10.10;
        option routers 10.10.30.254;
}
# OUTSIDE zone - REMOTE (through the relay on FW, giaddr 203.0.113.10)
# no "option routers": REMOTE reaches the inside only through the VPN
subnet 203.0.113.0 netmask 255.255.255.0 {
        range 203.0.113.100 203.0.113.150;
        option domain-name-servers 10.10.10.10;
}
